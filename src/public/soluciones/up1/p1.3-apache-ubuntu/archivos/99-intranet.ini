; /etc/php/8.3/apache2/conf.d/99-intranet.ini   (Ubuntu 26.04: /etc/php/8.5/apache2/conf.d/)
; Alternativa a editar php.ini: los archivos de conf.d se leen después de php.ini
; y no se pierden ni generan conflictos al actualizar el paquete.
upload_max_filesize = 32M
post_max_size = 33M          ; debe ser mayor que upload_max_filesize
date.timezone = Europe/Madrid
