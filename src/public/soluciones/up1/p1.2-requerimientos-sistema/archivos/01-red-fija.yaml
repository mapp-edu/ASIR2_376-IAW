# /etc/netplan/01-red-fija.yaml
# IP fija del servidor de la tienda (P1.2).
# Adaptar: nombre de la interfaz (ip -br link), red del aula o de la red NAT/puente de la VM.
# Permisos: sudo chmod 600 /etc/netplan/01-red-fija.yaml (netplan avisa si otros pueden leerlo).
network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s3:
      dhcp4: false
      addresses:
        - 192.168.1.50/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [1.1.1.1, 8.8.8.8]
