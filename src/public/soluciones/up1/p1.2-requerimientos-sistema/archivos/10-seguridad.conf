# /etc/ssh/sshd_config.d/10-seguridad.conf
# Endurecimiento de SSH para el servidor de la tienda (P1.2).
# Se usa un archivo aparte para no tocar el sshd_config del paquete:
# sobrevive a las actualizaciones y se ve de un vistazo qué se ha cambiado.

# root no puede iniciar sesión por SSH: se entra con el usuario administrador y sudo
PermitRootLogin no

# Máximo de intentos de contraseña por conexión
MaxAuthTries 3

# Cuando las claves estén configuradas y probadas (ssh-copy-id), activar:
# PasswordAuthentication no
