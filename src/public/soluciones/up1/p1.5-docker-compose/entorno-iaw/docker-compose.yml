# Entorno integrado de pruebas para IAW: Apache + PHP 8.3, MariaDB y Adminer.
# Las contraseñas y los nombres se leen del archivo .env (ver .env.example).

name: entorno-iaw

services:
  web:
    build: .                          # imagen propia: php:8.3-apache + pdo_mysql (ver Dockerfile)
    image: entorno-iaw-web:1.0
    ports:
      - "8080:80"                     # http://localhost:8080 -> puerto 80 del contenedor
    volumes:
      - ./src:/var/www/html           # el código se edita en el equipo y se ve al instante
    environment:
      TZ: ${TZ_WEB:-Europe/Madrid}    # zona horaria del servidor (pregunta 7)
      DB_HOST: db                     # nombre del servicio = nombre de host en la red interna
      DB_NAME: ${DB_NAME:?Falta DB_NAME en .env}
      DB_USER: ${DB_USER:?Falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy    # no arranca hasta que MariaDB acepta conexiones
    restart: unless-stopped

  db:
    image: mariadb:11.4               # versión LTS fijada: el entorno es reproducible
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ_WEB:-Europe/Madrid}
    volumes:
      - datos-db:/var/lib/mysql       # los datos sobreviven a docker compose down
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # Sin "ports": la base de datos solo es accesible desde la red interna del entorno.

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"                   # http://localhost:8081
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  datos-db:
